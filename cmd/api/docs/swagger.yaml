  /api/courses:
    get:
      consumes:
      - application/json
      description: Get all courses with pagination and filters
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.StandardResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/dto.PaginationResponse'
                  - properties:
                      data:
                        items:
                          $ref: '#/definitions/dto.CourseResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get all courses
      tags:
      - courses
    post:
      consumes:
      - multipart/form-data
      description: Create a new course with optional thumbnail upload and instructor
        assignment
      parameters:
      - description: Course name
        in: formData
        name: name
        required: true
        type: string
      - description: Course description
        in: formData
        name: description
        required: true
        type: string
      - description: Course price
        in: formData
        name: price
        required: true
        type: number
      - description: Limit user progress (optional)
        in: formData
        name: is_progress_limited
        type: boolean
      - description: Course type ID (UUID)
        in: formData
        name: course_type_id
        required: true
        type: string
      - description: Instructor ID (UUID) - optional, assign instructor to course
        in: formData
        name: instructor_id
        type: string
      - description: Course thumbnail (optional)
        in: formData
        name: thumbnail
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.StandardResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CourseDetailResponse'
              type: object
        "400":
          description: Invalid input or bad request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
