basePath: /
definitions:
  dto.ActivityResponse:
    properties:
      activity_name:
        type: string
      id:
        type: string
      user:
        $ref: '#/definitions/dto.UserSimpleDTO'
      when:
        type: string
    type: object
  dto.BaseResponseBiodata:
    properties:
      data:
        $ref: '#/definitions/dto.BiodataResponse'
      message:
        type: string
      status:
        example: true
        type: boolean
    type: object
  dto.BiodataResponse:
    properties:
      age:
        type: integer
      id:
        type: string
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
      user_id:
        type: string
    type: object
  dto.BiodataResponseForAct:
    properties:
      age:
        type: integer
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
    type: object
  dto.FirebaseLoginRequest:
    properties:
      token:
        type: string
    type: object
  dto.UserLoginResponse:
    properties:
      data:
        $ref: '#/definitions/dto.UserResponseDTO'
      message:
        type: string
      status:
        type: string
    type: object
  dto.UserResponseDTO:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firebaseId:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      lastLogin:
        type: string
      roles:
        $ref: '#/definitions/models.Role'
      username:
        type: string
    type: object
  dto.UserSimpleDTO:
    properties:
      biodata:
        $ref: '#/definitions/dto.BiodataResponseForAct'
      email:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  handler.AssignRoleRequest:
    properties:
      role_id:
        type: string
    required:
    - role_id
    type: object
  models.Activity:
    properties:
      activity_name:
        type: string
      id:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
      when:
        type: string
    type: object
  models.Biodata:
    properties:
      age:
        type: integer
      deleted_at:
        format: date-time
        type: string
      id:
        type: string
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
      user_id:
        type: string
    type: object
  models.Course:
    properties:
      course_type:
        $ref: '#/definitions/models.CourseType'
      course_type_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/models.User'
      description:
        type: string
      enrollments:
        items:
          $ref: '#/definitions/models.Enrollment'
        type: array
      id:
        type: string
      is_progress_limited:
        type: boolean
      modules:
        items:
          $ref: '#/definitions/models.Module'
        type: array
      name:
        type: string
      price:
        type: number
      quizzes:
        items:
          $ref: '#/definitions/models.Quiz'
        type: array
      zoom:
        $ref: '#/definitions/models.Zoom'
    type: object
  models.CourseType:
    properties:
      courses:
        items:
          $ref: '#/definitions/models.Course'
        type: array
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Enrollment:
    properties:
      completed_datetime:
        type: string
      course:
        $ref: '#/definitions/models.Course'
      course_id:
        type: string
      enrollment_datetime:
        type: string
      id:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.Lesson:
    properties:
      course_order:
        type: integer
      id:
        type: string
      module:
        $ref: '#/definitions/models.Module'
      module_id:
        type: string
      name:
        type: string
      user_completions:
        items:
          $ref: '#/definitions/models.UserLesson'
        type: array
      video_details:
        type: string
      video_id:
        type: string
    type: object
  models.Module:
    properties:
      course:
        $ref: '#/definitions/models.Course'
      course_id:
        type: string
      id:
        type: string
      lessons:
        items:
          $ref: '#/definitions/models.Lesson'
        type: array
      name:
        type: string
      number:
        type: integer
    type: object
  models.Quiz:
    properties:
      attempts:
        items:
          $ref: '#/definitions/models.UserQuizAttempt'
        type: array
      course:
        $ref: '#/definitions/models.Course'
      course_id:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/models.User'
      id:
        type: string
      is_pass_required:
        type: boolean
      min_pass_score:
        type: integer
      name:
        type: string
      number:
        type: integer
      questions:
        items:
          $ref: '#/definitions/models.QuizQuestion'
        type: array
    type: object
  models.QuizAnswer:
    properties:
      answer_text:
        type: string
      id:
        type: string
      is_correct:
        type: boolean
      question:
        $ref: '#/definitions/models.QuizQuestion'
      question_id:
        type: string
    type: object
  models.QuizQuestion:
    properties:
      answers:
        items:
          $ref: '#/definitions/models.QuizAnswer'
        type: array
      id:
        type: string
      question_title:
        type: string
      quiz:
        $ref: '#/definitions/models.Quiz'
      quiz_id:
        type: string
    type: object
  models.Role:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  utils.BaseResponse:
    properties:
      message:
        type: string
      status:
        type: boolean
    type: object
  utils.ErrorResponse:
    properties:
      errors: {}
      message:
        example: Invalid request body
        type: string
      status:
        example: error
        type: string
    type: object
host: http://192.168.100.247:7070
info:
  contact: {}
  description: API documentation for recipe API
  title: Course Online API
  version: "1.0"
paths:
  /admin/users/{user_id}/role:
    put:
      consumes:
      - application/json
      description: Assign a role to a specific user based on current user's permissions
      parameters:
      - description: Target User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Role ID to assign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign role to a user
      tags:
      - Roles
  /api/auth/firebase-login:
    post:
      consumes:
      - application/json
      description: This endpoint allows users to log in using a Firebase authentication
        token (e.g., Google Sign-In).
      parameters:
      - description: Bearer Firebase ID Token
        in: header
        name: Authorization
        type: string
      - description: Firebase token in JSON body (optional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.FirebaseLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/dto.UserLoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized or invalid Firebase token
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Login user using Firebase ID Token
      tags:
      - Authentication
  /api/history/activity:
    get:
      description: Retrieve all activities belonging to the authenticated user. The
        user is identified using Firebase UID from the JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: Success get All activity
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get all user activities
      tags:
      - Activity
  /api/profile/biodata:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully deleted
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Delete Biodata
      tags:
      - Profile
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: Get Biodata successfully
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get Biodata
      tags:
      - Profile
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: User name
        in: formData
        name: name
        required: true
        type: string
      - description: User age
        in: formData
        name: age
        required: true
        type: integer
      - description: User school
        in: formData
        name: school
        required: true
        type: string
      - description: Profile picture upload
        in: formData
        name: profile_picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully created
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Create Biodata
      tags:
      - Profile
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: User name (optional)
        in: formData
        name: name
        type: string
      - description: User age (optional)
        in: formData
        name: age
        type: integer
      - description: User school (optional)
        in: formData
        name: school
        type: string
      - description: Profile picture upload (optional)
        in: formData
        name: profile_picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully updated
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Update Biodata
      tags:
      - Profile

  /api/profile/biodata/restore:
    put:
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully restored
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Restore Biodata
      tags:
      - Profile
  /api/profile/biodata/soft-delete:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: Biodata soft deleted successfully
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: User or Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Soft Delete Biodata
      tags:
      - Profile
  /api/user:
    get:
      description: Retrieve a list of all users with their basic info, biodata, and
        roles
      produces:
      - application/json
      responses:
        "200":
          description: All users retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
              type: object
        "500":
          description: Failed to get users
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get all users
      tags:
      - Users
  /api/user/{id}:
    delete:
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/dto.BaseResponseDelete'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Delete user
      tags:
      - Users
    get:
      description: Retrieve user details including biodata, roles, and other relations
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/dto.BaseResponse'
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update user info, roles, and biodata by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User data to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/dto.BaseResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Update user
      tags:
      - Users
  /api/user/{id}/restore:
    patch:
      description: Mengembalikan user yang sudah di-soft delete
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User restored successfully
          schema:
            $ref: '#/definitions/dto.BaseResponseDelete'
        "404":
          description: User not found or already restored
          schema:
            $ref: '#/definitions/dto.BaseResponseDelete'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Restore soft deleted user
      tags:
      - Users
  /api/user/{id}/soft:
    delete:
      description: Soft delete user by ID (data tidak dihapus permanen, hanya ditandai
        terhapus)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User soft deleted successfully
          schema:
            $ref: '#/definitions/dto.BaseResponseDelete'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/dto.BaseResponseDelete'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Soft delete user
      tags:
      - Users
  /roles:
    get:
      description: Retrieve all roles in the system (super_admin & admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Role'
            type: array
      security:
      - BearerAuth: []
      summary: Get all roles
      tags:
      - Roles
  /roles/{id}:
    get:
      description: Retrieve a single role by its ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get role by ID
      tags:
      - Roles
  /roles/assignable:
    get:
      description: Get roles that the current user is allowed to assign
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Role'
            type: array
      security:
      - BearerAuth: []
      summary: Get assignable roles
      tags:
      - Roles
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
