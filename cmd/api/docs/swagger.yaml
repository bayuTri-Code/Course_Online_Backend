basePath: /
definitions:
  dto.ActivityResponse:
    properties:
      activity_name:
        type: string
      id:
        type: string
      user:
        $ref: '#/definitions/dto.UserSimpleDTO'
      when:
        type: string
    type: object
  dto.BaseResponseBiodata:
    properties:
      data:
        $ref: '#/definitions/dto.BiodataResponse'
      message:
        type: string
      status:
        example: true
        type: boolean
    type: object
  dto.BiodataResponse:
    properties:
      age:
        type: integer
      id:
        type: string
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
      user_id:
        type: string
    type: object
  dto.BiodataResponseForAct:
    properties:
      age:
        type: integer
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
    type: object
  dto.FirebaseLoginRequest:
    properties:
      token:
        type: string
    type: object
  dto.UserLoginResponse:
    properties:
      data:
        $ref: '#/definitions/dto.UserResponseDTO'
      message:
        type: string
      status:
        type: string
    type: object
  dto.UserResponseDTO:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firebaseId:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      lastLogin:
        type: string
      roles:
        $ref: '#/definitions/models.Role'
      username:
        type: string
    type: object
  dto.UserSimpleDTO:
    properties:
      biodata:
        $ref: '#/definitions/dto.BiodataResponseForAct'
      email:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  models.Role:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  utils.BaseResponse:
    properties:
      message:
        type: string
      status:
        type: boolean
    type: object
  utils.ErrorResponse:
    properties:
      errors: {}
      message:
        example: Invalid request body
        type: string
      status:
        example: error
        type: string
    type: object
host: http://192.168.100.247:7070
info:
  contact: {}
  description: API documentation for recipe API
  title: Course Online API
  version: "1.0"
paths:
  /api/auth/firebase-login:
    post:
      consumes:
      - application/json
      description: This endpoint allows users to log in using a Firebase authentication
        token (e.g., Google Sign-In).
      parameters:
      - description: Bearer Firebase ID Token
        in: header
        name: Authorization
        type: string
      - description: Firebase token in JSON body (optional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.FirebaseLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/dto.UserLoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized or invalid Firebase token
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Login user using Firebase ID Token
      tags:
      - Authentication
  /api/history/activity:
    get:
      description: Retrieve all activities belonging to the authenticated user. The
        user is identified using Firebase UID from the JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: Success get All activity
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get all user activities
      tags:
      - Activity
  /api/profile/biodata:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully deleted
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Delete Biodata
      tags:
      - Profile
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: Get Biodata successfully
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get Biodata
      tags:
      - Profile
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: User name
        in: formData
        name: name
        required: true
        type: string
      - description: User age
        in: formData
        name: age
        required: true
        type: integer
      - description: User school
        in: formData
        name: school
        required: true
        type: string
      - description: Profile picture upload
        in: formData
        name: profile_picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully created
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Create Biodata
      tags:
      - Profile
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: User name (optional)
        in: formData
        name: name
        type: string
      - description: User age (optional)
        in: formData
        name: age
        type: integer
      - description: User school (optional)
        in: formData
        name: school
        type: string
      - description: Profile picture upload (optional)
        in: formData
        name: profile_picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully updated
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Update Biodata
      tags:
      - Profile
swagger: "2.0"
