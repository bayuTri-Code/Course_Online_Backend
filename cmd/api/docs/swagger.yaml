info:
  contact: {}
  description: API documentation for Course Online
  title: Course Online API
  version: "1.0"
paths:
  /api/admin/roles:
    get:
      description: Retrieve all roles in the system (super_admin & admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Role'
            type: array
      security:
      - BearerAuth: []
      summary: Get all roles
      tags:
      - Roles
  /api/admin/roles/{id}:
    get:
      description: Retrieve a single role by its ID
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Role'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get role by ID
      tags:
      - Roles
  /api/admin/roles/assignable:
    get:
      description: Get roles that the current user is allowed to assign
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Role'
            type: array
      security:
      - BearerAuth: []
      summary: Get assignable roles
      tags:
      - Roles
  /api/admin/users/{user_id}/role:
    put:
      consumes:
      - application/json
      description: Assign a role to a specific user based on current user's permissions
      parameters:
      - description: Target User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Role ID to assign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AssignRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign role to a user
      tags:
      - Roles
  /api/auth/firebase-login:
    post:
      consumes:
      - application/json
      description: This endpoint allows users to log in using a Firebase authentication
        token (e.g., Google Sign-In).
      parameters:
      - description: Bearer Firebase ID Token
        in: header
        name: Authorization
        type: string
      - description: Firebase token in JSON body (optional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.FirebaseLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/dto.UserLoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized or invalid Firebase token
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Login user using Firebase ID Token
      tags:
      - Authentication
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user dan blacklist token saat ini
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Authentication
  /api/auth/otp/resend:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SendOTPResponse'
      summary: Resend OTP
      tags:
      - Authentication
  /api/auth/otp/send:
    post:
      consumes:
      - application/json
      description: Mengirimkan OTP ke email untuk proses login.
      parameters:
      - description: Email untuk dikirimkan OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP berhasil dikirim
          schema:
            $ref: '#/definitions/dto.SendOTPResponse'
        "400":
          description: Format email tidak valid
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Rate limit tercapai
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Gagal mengirim OTP
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Send OTP to email
      tags:
      - Authentication
  /api/auth/otp/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verify OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login Berhasil
          schema:
            $ref: '#/definitions/dto.VerifyOTPResponse'
        "400":
          description: OTP tidak valid atau telah kedaluwarsa
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "429":
          description: Rate limit tercapai
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Terjadi kesalahan pada server
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Verify OTP and login
      tags:
      - Authentication
  /api/course-types:
    get:
      consumes:
      - application/json
      description: Retrieve all course types/categories
