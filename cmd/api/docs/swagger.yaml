basePath: /
definitions:
  dto.ActivityResponse:
    properties:
      activity_name:
        type: string
      id:
        type: string
      user:
        $ref: '#/definitions/dto.UserSimpleDTO'
      when:
        type: string
    type: object
  dto.AdminDashboardResponse:
    properties:
      total_courses:
        type: integer
      total_users:
        type: integer
    type: object
  dto.BaseResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
  dto.BaseResponseBiodata:
    properties:
      data:
        $ref: '#/definitions/dto.BiodataResponse'
      message:
        type: string
      status:
        example: true
        type: boolean
    type: object
  dto.BaseResponseDelete:
    properties:
      message:
        type: string
      status:
        type: boolean
    type: object
  dto.BiodataResponse:
    properties:
      age:
        type: integer
      id:
        type: string
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
      user_id:
        type: string
    type: object
  dto.BiodataResponseForAct:
    properties:
      age:
        type: integer
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
    type: object
  dto.FirebaseLoginRequest:
    properties:
      token:
        type: string
    type: object
  dto.InstructorDashboardResponse:
    properties:
      message:
        type: string
      my_courses:
        type: integer
    type: object
  dto.StudentDashboardResponse:
    properties:
      enrolled_courses:
        type: integer
      message:
        type: string
    type: object
  dto.SuperAdminDashboardResponse:
    properties:
      system_status:
        type: string
      total_instructors:
        type: integer
      total_students:
        type: integer
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role_ids:
        example:
        - role_id
        items:
          type: string
        type: array
    type: object
  dto.UserLoginResponse:
    properties:
      data:
        $ref: '#/definitions/dto.UserResponseDTO'
      message:
        type: string
      status:
        type: string
    type: object
  dto.UserResponseDTO:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firebaseId:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      lastLogin:
        type: string
      roles:
        $ref: '#/definitions/models.Role'
      username:
        type: string
    type: object
  dto.UserSimpleDTO:
    properties:
      biodata:
        $ref: '#/definitions/dto.BiodataResponseForAct'
      email:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  models.Activity:
    properties:
      activity_name:
        type: string
      id:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
      when:
        type: string
    type: object
  models.Biodata:
    properties:
      age:
        type: integer
      deleted_at:
        format: date-time
        type: string
      id:
        type: string
      name:
        type: string
      profile_picture:
        type: string
      school:
        type: string
      user_id:
        type: string
    type: object
  models.Course:
    properties:
      course_type:
        $ref: '#/definitions/models.CourseType'
      course_type_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/models.User'
      description:
        type: string
      enrollments:
        items:
          $ref: '#/definitions/models.Enrollment'
        type: array
      id:
        type: string
      is_progress_limited:
        type: boolean
      modules:
        items:
          $ref: '#/definitions/models.Module'
        type: array
      name:
        type: string
      price:
        type: number
      quizzes:
        items:
          $ref: '#/definitions/models.Quiz'
        type: array
      zoom:
        $ref: '#/definitions/models.Zoom'
    type: object
  models.CourseType:
    properties:
      courses:
        items:
          $ref: '#/definitions/models.Course'
        type: array
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  models.Enrollment:
    properties:
      completed_datetime:
        type: string
      course:
        $ref: '#/definitions/models.Course'
      course_id:
        type: string
      enrollment_datetime:
        type: string
      id:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.Lesson:
    properties:
      course_order:
        type: integer
      id:
        type: string
      module:
        $ref: '#/definitions/models.Module'
      module_id:
        type: string
      name:
        type: string
      user_completions:
        items:
          $ref: '#/definitions/models.UserLesson'
        type: array
      video_details:
        type: string
      video_id:
        type: string
    type: object
  models.Module:
    properties:
      course:
        $ref: '#/definitions/models.Course'
      course_id:
        type: string
      id:
        type: string
      lessons:
        items:
          $ref: '#/definitions/models.Lesson'
        type: array
      name:
        type: string
      number:
        type: integer
    type: object
  models.Quiz:
    properties:
      attempts:
        items:
          $ref: '#/definitions/models.UserQuizAttempt'
        type: array
      course:
        $ref: '#/definitions/models.Course'
      course_id:
        type: string
      created_by:
        type: string
      creator:
        $ref: '#/definitions/models.User'
      id:
        type: string
      is_pass_required:
        type: boolean
      min_pass_score:
        type: integer
      name:
        type: string
      number:
        type: integer
      questions:
        items:
          $ref: '#/definitions/models.QuizQuestion'
        type: array
    type: object
  models.QuizAnswer:
    properties:
      answer_text:
        type: string
      id:
        type: string
      is_correct:
        type: boolean
      question:
        $ref: '#/definitions/models.QuizQuestion'
      question_id:
        type: string
    type: object
  models.QuizQuestion:
    properties:
      answers:
        items:
          $ref: '#/definitions/models.QuizAnswer'
        type: array
      id:
        type: string
      question_title:
        type: string
      quiz:
        $ref: '#/definitions/models.Quiz'
      quiz_id:
        type: string
    type: object
  models.Role:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  models.User:
    properties:
      activities:
        items:
          $ref: '#/definitions/models.Activity'
        type: array
      biodata:
        $ref: '#/definitions/models.Biodata'
      completed_lessons:
        items:
          $ref: '#/definitions/models.UserLesson'
        type: array
      created_at:
        type: string
      created_courses:
        items:
          $ref: '#/definitions/models.Course'
        type: array
      created_quizzes:
        items:
          $ref: '#/definitions/models.Quiz'
        type: array
      deleted_at:
        format: date-time
        type: string
      email_address:
        type: string
      enrollments:
        items:
          $ref: '#/definitions/models.Enrollment'
        type: array
      firebase_uid:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login:
        type: string
      quiz_attempts:
        items:
          $ref: '#/definitions/models.UserQuizAttempt'
        type: array
      roles:
        items:
          $ref: '#/definitions/models.Role'
        type: array
      username:
        type: string
    type: object
  models.UserLesson:
    properties:
      completed_datetime:
        type: string
      id:
        type: string
      lesson:
        $ref: '#/definitions/models.Lesson'
      lesson_id:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.UserQuizAttempt:
    properties:
      attempt_datetime:
        type: string
      id:
        type: string
      quiz:
        $ref: '#/definitions/models.Quiz'
      quiz_id:
        type: string
      score_achieved:
        type: integer
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: string
    type: object
  models.Zoom:
    properties:
      course:
        $ref: '#/definitions/models.Course'
      course_id:
        type: string
      id:
        type: string
      link:
        type: string
    type: object
  utils.BaseResponse:
    properties:
      message:
        type: string
      status:
        type: boolean
    type: object
  utils.BaseResponsedata:
    properties:
      data: {}
      message:
        type: string
      status:
        type: boolean
    type: object
  utils.ErrorResponse:
    properties:
      errors: {}
      message:
        example: Server Internal error 500
        type: string
      status:
        example: false
        type: boolean
    type: object
host: 192.168.100.247:8080
info:
  contact: {}
  description: API documentation for Course Online
  title: Course Online API
  version: "1.0"
paths:
  /api/auth/firebase-login:
    post:
      consumes:
      - application/json
      description: This endpoint allows users to log in using a Firebase authentication
        token (e.g., Google Sign-In).
      parameters:
      - description: Bearer Firebase ID Token
        in: header
        name: Authorization
        type: string
      - description: Firebase token in JSON body (optional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.FirebaseLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/dto.UserLoginResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized or invalid Firebase token
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Login user using Firebase ID Token
      tags:
      - Authentication
  /api/dashboard/admin:
    get:
      consumes:
      - application/json
      description: Retrieve overview data for Admin, including total users and total
        courses.
      produces:
      - application/json
      responses:
        "200":
          description: Success get admin dashboard
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponsedata'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminDashboardResponse'
              type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "403":
          description: Forbidden - insufficient role
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get Admin Dashboard
      tags:
      - Dashboard
  /api/dashboard/instructor:
    get:
      consumes:
      - application/json
      description: Retrieve dashboard data for Instructor, including number of created
        courses.
      produces:
      - application/json
      responses:
        "200":
          description: Success get admin dashboard
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponsedata'
            - properties:
                data:
                  $ref: '#/definitions/dto.InstructorDashboardResponse'
              type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "403":
          description: Forbidden - insufficient role
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get Instructor Dashboard
      tags:
      - Dashboard
  /api/dashboard/student:
    get:
      consumes:
      - application/json
      description: Retrieve dashboard data for Student, including enrolled courses
        and motivational message.
      produces:
      - application/json
      responses:
        "200":
          description: Success get admin dashboard
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponsedata'
            - properties:
                data:
                  $ref: '#/definitions/dto.StudentDashboardResponse'
              type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "403":
          description: Forbidden - insufficient role
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get Student Dashboard
      tags:
      - Dashboard
  /api/dashboard/super_admin:
    get:
      consumes:
      - application/json
      description: Retrieve overview data for Super Admin, including total instructors
        and students.
      produces:
      - application/json
      responses:
        "200":
          description: Success get admin dashboard
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponsedata'
            - properties:
                data:
                  $ref: '#/definitions/dto.SuperAdminDashboardResponse'
              type: object
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "403":
          description: Forbidden - insufficient role
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get Super Admin Dashboard
      tags:
      - Dashboard
  /api/history/All-activity:
    get:
      description: Retrieve all activities belonging to the authenticated user based
        on Firebase UID from JWT token
      produces:
      - application/json
      responses:
        "200":
          description: Success get all activity
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all user activities
      tags:
      - Activity
  /api/history/ByRole-activity/{role}:
    get:
      description: Retrieve all activities performed by users with a specific role
      parameters:
      - description: User Role (e.g. student, instructor, admin, student)
        in: path
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success get activity by role
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get Activity By Role
      tags:
      - Activity
  /api/history/ByUser-activity/{id}:
    get:
      consumes:
      - application/json
      description: Get all activities associated with a specific user ID
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success get activity by user
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get Activity By User ID
      tags:
      - Activity
  /api/history/Recent-activity:
    get:
      description: Retrieve a list of the most recent user activities
      parameters:
      - description: Number of recent activities to return (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success get recent activities
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get Recent Activities
      tags:
      - Activity
  /api/history/Search-activity:
    get:
      description: Search activity records by keyword
      parameters:
      - description: Keyword to search activity
        in: query
        name: keyword
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success search activity
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "400":
          description: Keyword is required
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Search Activity
      tags:
      - Activity
  /api/history/Summary-activity/{id}:
    get:
      description: Get summarized activity statistics for a specific user
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success get activity summary
          schema:
            allOf:
            - $ref: '#/definitions/utils.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ActivityResponse'
                  type: array
              type: object
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get Activity Summary
      tags:
      - Activity
  /api/profile/biodata:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully deleted
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Delete Biodata
      tags:
      - Profile
    get:
      consumes:
      - application/json
      description: Get biodata of the currently authenticated user (token required)
      produces:
      - application/json
      responses:
        "200":
          description: Get Biodata successfully
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get My Biodata
      tags:
      - Profile
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: User name
        in: formData
        name: name
        required: true
        type: string
      - description: User age
        in: formData
        name: age
        required: true
        type: integer
      - description: User school
        in: formData
        name: school
        required: true
        type: string
      - description: Profile picture upload
        in: formData
        name: profile_picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully created
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Create Biodata
      tags:
      - Profile
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: User name (optional)
        in: formData
        name: name
        type: string
      - description: User age (optional)
        in: formData
        name: age
        type: integer
      - description: User school (optional)
        in: formData
        name: school
        type: string
      - description: Profile picture upload (optional)
        in: formData
        name: profile_picture
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully updated
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Update Biodata
      tags:
      - Profile
  /api/profile/biodata/restore:
    put:
      produces:
      - application/json
      responses:
        "200":
          description: Biodata successfully restored
          schema:
            $ref: '#/definitions/dto.BaseResponseBiodata'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Restore Biodata
      tags:
      - Profile
  /api/profile/biodata/soft-delete:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: Biodata soft deleted successfully
          schema:
            $ref: '#/definitions/utils.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: User or Biodata not found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Soft Delete Biodata
      tags:
      - Profile
  /api/user:
    get:
      description: Retrieve a list of all users with their basic info, biodata, and
        roles
      produces:
      - application/json
      responses:
        "200":
          description: All users retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
              type: object
        "500":
          description: Failed to get users
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      summary: Get all users
      tags:
      - Users
  /api/user/{id}:
    delete:
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/dto.BaseResponseDelete'
